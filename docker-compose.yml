# A throwaway PostgreSQL for the live test in tests/test_postgres.py, and a service that runs it.
#
# Everything in Docker:
#   docker compose run --rm --build tests     # starts postgres, runs tests/test_postgres.py
#   docker compose run --rm tests -k live     # extra args go to pytest
#   docker compose down
#
# Or only the database, with the tests from your own venv (pip install -e ".[dev,postgres]"):
#   docker compose up -d --wait
#   $env:FITFLEET_TEST_POSTGRES_URL = "postgresql://postgres:pw@localhost:55432/postgres"   # bash: export ...
#   pytest tests/test_postgres.py
#   docker compose down
#
# Port 55432 on the host, so it does not clash with a local PostgreSQL on 5432.
# The data lives in memory (tmpfs) and is gone after `docker compose down`.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: pw
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost"]
      interval: 1s
      timeout: 3s
      retries: 30

  tests:
    profiles: ["tests"]  # `docker compose up` starts only the database
    build:
      context: .
      args:
        PYTHON_VERSIONS: "3.11 3.13"
        EXTRAS: "dev,postgres"
    image: fitfleet-tests-postgres  # not fitfleet-tests, which scripts/docker_test.py builds without psycopg
    shm_size: 2gb
    environment:
      FITFLEET_TEST_POSTGRES_URL: postgresql://postgres:pw@postgres:5432/postgres
    depends_on:
      postgres:
        condition: service_healthy
    command: ["tests/test_postgres.py", "-rs"]
